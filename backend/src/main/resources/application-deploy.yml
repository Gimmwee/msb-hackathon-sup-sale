server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:supsale;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

greennode:
  api-key: ${GREENNODE_API_KEY:}
  base-url: ${LLM_BASE_URL:https://maas-llm-aiplatform-hcm.api.vngcloud.vn/v1}
  model-customer: ${LLM_MODEL_CUSTOMER:qwen/qwen3.6-flash}
  model-staff: ${LLM_MODEL_STAFF:qwen/qwen3.6-flash}
  mock: ${LLM_MOCK:false}

dashboard:
  api-key: ${DASHBOARD_API_KEY:demo-key}

jwt:
  secret: ${JWT_SECRET:msb-sup-sale-hackathon-2026-secret-key-32chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

mail:
  from: ${MAIL_FROM:noreply@sup-sale.msb.demo}

spring.mail:
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:}
  password: ${SMTP_PASS:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

cors:
  allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    com.msb.supsale: INFO
