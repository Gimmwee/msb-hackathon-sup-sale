server:
  port: 8080
  tomcat:
    max-swallow-size: 20MB
  max-http-header-size: 16KB

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db:5432/supsale}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  sql:
    init:
      mode: always

greennode:
  api-key: ${GREENNODE_API_KEY:}
  base-url: ${LLM_BASE_URL:https://maas-llm-aiplatform-hcm.api.vngcloud.vn/v1}
  model-customer: ${LLM_MODEL_CUSTOMER:qwen/qwen3.6-flash}
  model-staff: ${LLM_MODEL_STAFF:qwen/qwen3.6-flash}
  mock: ${LLM_MOCK:false}

dashboard:
  api-key: ${DASHBOARD_API_KEY:demo-key}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

mail:
  from: ${MAIL_FROM:noreply@sup-sale.msb.demo}

spring.mail:
  host: ${SMTP_HOST:}
  port: ${SMTP_PORT:587}
  username: ${SMTP_USER:}
  password: ${SMTP_PASS:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

zalo:
  bot-token: ${ZALO_BOT_TOKEN:}
  oa-secret-key: ${ZALO_OA_SECRET_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    com.msb.supsale: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
